{% macro field(f) %}<label>{{f.label}}{{f()}}{% for e in f.errors %}<small class="field-error">{{e}}</small>{% endfor %}</label>{% endmacro %}{% macro modal(id,title,form,action) %}<dialog class="modal" id="{{id}}"><form method="post" action="{{action}}" enctype="multipart/form-data">{{form.hidden_tag()}}<header><div><p class="eyebrow">INVENTORY WORKFLOW</p><h2>{{title}}</h2></div><button type="button" class="icon-button" data-close-modal>×</button></header><div class="modal-body">{{caller()}}</div><footer><button type="button" class="secondary-button" data-close-modal>Cancel</button>{{form.submit(class='primary-button')}}</footer></form></dialog>{% endmacro %}
